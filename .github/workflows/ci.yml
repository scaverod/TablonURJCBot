name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check tests

  tests:
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 2026-10-19
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
